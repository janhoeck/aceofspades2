name: .NET Build & Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dotnet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      # Mit LFS: Tests laden die echte Map (maps/*.aos2map liegt in Git LFS, ohne LFS stünde dort nur ein Verweis).
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore AoS2.slnx

      - name: Build
        run: dotnet build AoS2.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test AoS2.slnx --configuration Release --no-build --logger trx --results-directory TestResults

      - name: Testergebnisse hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore

  backend-image:
    name: Backend-Image bauen (ohne Hochladen)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker-Build
        run: docker build --file deploy/backend.Dockerfile --tag aos2-backend:test .

  server-image:
    name: Server-Image bauen und starten (ohne Hochladen)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Docker-Build
        run: docker build --file deploy/server.Dockerfile --tag aos2-server:test .
      # Startet der Server im Container (Spieldaten und Map gefunden, UDP-Port offen)?
      - name: Probestart
        run: |
          mkdir -p config
          echo '{ "name": "CI", "dev": true }' > config/server.json
          docker run -d --name aos2-server -v "$PWD/config:/config:ro" aos2-server:test
          for i in $(seq 1 20); do
            if docker logs aos2-server 2>&1 | grep -q "lauscht auf UDP-Port 32887"; then docker logs aos2-server; docker rm -f aos2-server; exit 0; fi
            sleep 1
          done
          docker logs aos2-server; exit 1
