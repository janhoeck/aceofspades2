name: .NET Build & Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dotnet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      # Ohne LFS: Der .NET-Build braucht keine Texturen oder Modelle.
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore AoS2.slnx

      - name: Build
        run: dotnet build AoS2.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test AoS2.slnx --configuration Release --no-build --logger trx --results-directory TestResults

      - name: Testergebnisse hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore
